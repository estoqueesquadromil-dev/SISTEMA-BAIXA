<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Baixa - Inventário</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; color: #333; box-sizing: border-box; }
        .container { max-width: 100%; width: 100%; margin: 0 auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { color: #0056b3; font-size: 22px; margin-top: 0; }
        
        .abas { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .btn-aba { background: #e0e0e0; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; color: #555; }
        .btn-aba.ativo { background: #0056b3; color: white; }
        .painel { display: none; }
        .painel.ativo { display: block; }

        .form-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: flex-end; flex-wrap: wrap; }
        
        .form-group { flex: 1; min-width: 150px; position: relative; }
        .form-group-codigo { flex: 3; min-width: 280px; position: relative; }

        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input[type="date"], input[type="text"], input[type="number"], select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        
        #resultados-busca { 
            position: absolute; top: 100%; left: 0; right: 0; 
            background: white; border: 1px solid #0056b3; max-height: 200px; 
            overflow-y: auto; z-index: 9999; border-radius: 0 0 4px 4px; 
            box-sizing: border-box;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15); 
        }
        .item-resultado { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 14px; }
        .item-resultado:hover { background-color: #e8f0fe; color: #0056b3; font-weight: bold; }

        .table-responsive { width: 100%; overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 8px 10px; border: 1px solid #ddd; text-align: left; font-size: 14px; word-wrap: break-word; overflow: hidden; text-overflow: ellipsis; }
        th { background-color: #0056b3; color: white; }
        
        .btn-acao { padding: 5px 8px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; color: white; margin-right: 3px; display: inline-block; }
        .btn-editar { background-color: #ffc107; color: #333; }
        .btn-excluir { background-color: #dc3545; }
        .btn-adicionar { background-color: #007bff; height: 42px; padding: 0 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
        .btn-salvar { background-color: #28a745; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; }
        .btn-pesquisar { background-color: #17a2b8; height: 42px; padding: 0 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
        
        .painel-lote-status { background: #f8f9fa; padding: 12px; border: 1px solid #ddd; border-radius: 4px; margin-top: 15px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .contador-badge { background: #e9ecef; padding: 8px 12px; border-radius: 4px; font-weight: bold; font-size: 14px; margin-top: 10px; display: inline-block; }
        
        #mensagem { margin-top: 15px; padding: 10px; border-radius: 4px; font-weight: bold; display: none; }
        .sucesso { background-color: #d4edda; color: #155724; }
        .erro { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sistema de Baixa de Inventário</h1>

    <div class="abas">
        <button class="btn-aba ativo" onclick="mudarAba('baixa', this)">Realizar Baixa</button>
        <button class="btn-aba" onclick="mudarAba('consulta', this)">Consultar Baixas do Dia</button>
    </div>

    <!-- PAINEL 1: REALIZAR BAIXA -->
    <div id="painel-baixa" class="painel ativo">
        <div class="form-group" style="margin-bottom: 20px; max-width: 250px;">
            <label for="data-lote">Data da Movimentação:</label>
            <input type="date" id="data-lote">
        </div>

        <div class="form-row">
            <div class="form-group-codigo">
                <label for="input-codigo">Código do Produto:</label>
                <input type="text" id="input-codigo" placeholder="Comece a digitar o código..." autocomplete="off">
                <div id="resultados-busca"></div>
            </div>
            <div class="form-group" style="max-width: 120px;">
                <label for="input-qtd">Quantidade:</label>
                <input type="number" id="input-qtd" value="1" min="1">
            </div>
            <button class="btn-adicionar" onclick="adicionarItemLista()">Adicionar</button>
        </div>

        <h3>Itens na Lista</h3>
        <div class="table-responsive">
            <table id="tabela-itens">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Quantidade</th>
                        <th style="width: 150px;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3" style="text-align: center; color: #777;">Nenhum item adicionado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button class="btn-salvar" onclick="salvarLote()">Registar na Planilha do Google Sheets</button>
        <div id="mensagem"></div>
    </div>

    <!-- PAINEL 2: CONSULTAR BAIXAS COM SELEÇÃO E STATUS -->
    <div id="painel-consulta" class="painel">
        <div class="form-row">
            <div class="form-group" style="max-width: 250px;">
                <label for="data-consulta">Selecione a Data:</label>
                <input type="date" id="data-consulta">
            </div>
            <button class="btn-pesquisar" onclick="consultarBaixas()">Pesquisar</button>
        </div>

        <div id="contador-ordens" class="contador-badge" style="display: none;">Total de Ordens: 0</div>

        <div class="painel-lote-status" id="painel-lote" style="display: none;">
            <div class="form-group" style="max-width: 200px; margin: 0;">
                <label for="status-lote">Alterar Status Selecionados:</label>
                <select id="status-lote">
                    <option value="Sim">Sim</option>
                    <option value="Não" selected>Não</option>
                </select>
            </div>
            <button class="btn-pesquisar" style="height: 38px;" onclick="aplicarStatusEmMassa()">Salvar Alteração em Lote</button>
        </div>

        <h3>Itens dados baixa no dia</h3>
        <div class="table-responsive">
            <table id="tabela-consulta">
                <thead>
                    <tr>
                        <th style="width: 40px; text-align: center;"><input type="checkbox" id="check-todos" onclick="alternarTodasSelecoes(this)"></th>
                        <th>Data</th>
                        <th>Código</th>
                        <th>Quantidade</th>
                        <th>Status</th>
                        <th style="width: 140px;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" style="text-align: center; color: #777;">Selecione uma data e clique em Pesquisar.</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div id="mensagem-consulta" style="margin-top: 15px; font-weight: bold;"></div>
    </div>

</div>

<script>
    document.getElementById('data-lote').valueAsDate = new Date();
    document.getElementById('data-consulta').valueAsDate = new Date();
    
    let itensSelecionados = [];
    let produtoSelecionadoTemp = null;

    const inputCodigo = document.getElementById('input-codigo');
    const divResultados = document.getElementById('resultados-busca');
    const inputQtd = document.getElementById('input-qtd');

    function mudarAba(aba, btn) {
        document.querySelectorAll('.painel').forEach(p => p.classList.remove('ativo'));
        document.querySelectorAll('.btn-aba').forEach(b => b.classList.remove('ativo'));
        
        if (aba === 'baixa') {
            document.getElementById('painel-baixa').classList.add('ativo');
        } else {
            document.getElementById('painel-consulta').classList.add('ativo');
        }
        btn.classList.add('ativo');
    }

    inputCodigo.addEventListener('input', async function() {
        let termo = this.value.trim();
        produtoSelecionadoTemp = null;
        if (termo.length < 1) {
            divResultados.innerHTML = '';
            return;
        }
        try {
            let resposta = await fetch(`/buscar_produtos?termo=${encodeURIComponent(termo)}`);
            let produtos = await resposta.json();
            
            divResultados.innerHTML = '';
            if (produtos.length === 0) {
                divResultados.innerHTML = '<div class="item-resultado" style="color: #999;">Nenhum produto encontrado</div>';
                return;
            }

            produtos.forEach(p => {
                let div = document.createElement('div');
                div.className = 'item-resultado';
                div.textContent = `${p.codigo} - ${p.descricao}`;
                div.onclick = () => {
                    inputCodigo.value = p.codigo;
                    produtoSelecionadoTemp = p;
                    divResultados.innerHTML = '';
                };
                divResultados.appendChild(div);
            });
        } catch (err) {
            console.error("Erro na busca:", err);
        }
    });

    document.addEventListener('click', function(e) {
        if (!inputCodigo.contains(e.target) && !divResultados.contains(e.target)) {
            divResultados.innerHTML = '';
        }
    });

    function adicionarItemLista() {
        let codigoDigitado = inputCodigo.value.trim();
        let quantidade = parseInt(inputQtd.value) || 1;

        if (!codigoDigitado) {
            alert('Informe o código do produto.');
            return;
        }

        let existente = itensSelecionados.find(i => i.CODIGO.toLowerCase() === codigoDigitado.toLowerCase());
        
        if (existente) {
            existente.QUANTIDADE += quantidade;
        } else {
            itensSelecionados.push({ CODIGO: codigoDigitado, QUANTIDADE: quantidade });
        }

        inputCodigo.value = '';
        inputQtd.value = '1';
        produtoSelecionadoTemp = null;
        divResultados.innerHTML = '';
        atualizarTabela();
    }

    function removerItem(codigo) {
        itensSelecionados = itensSelecionados.filter(i => i.CODIGO !== codigo);
        atualizarTabela();
    }

    function editarItem(codigo) {
        let item = itensSelecionados.find(i => i.CODIGO === codigo);
        if (item) {
            let novaQtd = prompt(`Editar quantidade para o produto ${codigo}:`, item.QUANTIDADE);
            if (novaQtd !== null) {
                let qtdNum = parseInt(novaQtd);
                if (qtdNum > 0) {
                    item.QUANTIDADE = qtdNum;
                    atualizarTabela();
                } else {
                    alert('Quantidade inválida.');
                }
            }
        }
    }

    function atualizarTabela() {
        let tbody = document.querySelector('#tabela-itens tbody');
        tbody.innerHTML = '';
        
        if (itensSelecionados.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #777;">Nenhum item adicionado ainda.</td></tr>';
            return;
        }

        itensSelecionados.forEach(item => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.CODIGO}</td>
                <td>${item.QUANTIDADE}</td>
                <td>
                    <button class="btn-acao btn-editar" onclick="editarItem('${item.CODIGO}')">Editar</button>
                    <button class="btn-acao btn-excluir" onclick="removerItem('${item.CODIGO}')">Excluir</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function salvarLote() {
        let data = document.getElementById('data-lote').value;
        let msgDiv = document.getElementById('mensagem');
        let btnSalvar = document.querySelector('.btn-salvar');

        if (!data || itensSelecionados.length === 0) {
            msgDiv.className = 'erro';
            msgDiv.textContent = 'Por favor, selecione uma data e adicione pelo menos um item à lista.';
            msgDiv.style.display = 'block';
            return;
        }

        // BLOQUEIO CONTRA DUPLO CLIQUE: Desativa o botão e altera o texto instantaneamente
        btnSalvar.disabled = true;
        btnSalvar.style.opacity = '0.6';
        btnSalvar.style.cursor = 'not-allowed';
        btnSalvar.textContent = 'A registar na planilha...';

        try {
            let resposta = await fetch('/salvar_lote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: data, itens: itensSelecionados })
            });
            let resultado = await resposta.json();

            msgDiv.style.display = 'block';
            if (resultado.sucesso) {
                msgDiv.className = 'sucesso';
                msgDiv.textContent = resultado.mensagem;
                itensSelecionados = [];
                atualizarTabela();
            } else {
                msgDiv.className = 'erro';
                msgDiv.textContent = resultado.mensagem;
            }
        } catch (err) {
            msgDiv.className = 'erro';
            msgDiv.textContent = 'Erro de comunicação com o servidor.';
            msgDiv.style.display = 'block';
        } finally {
            // RESTAURA O BOTÃO: Volta ao normal independentemente do resultado
            btnSalvar.disabled = false;
            btnSalvar.style.opacity = '1';
            btnSalvar.style.cursor = 'pointer';
            btnSalvar.textContent = 'Registar na Planilha do Google Sheets';
        }
    }

    async function consultarBaixas() {
        let dataConsulta = document.getElementById('data-consulta').value;
        let tbody = document.querySelector('#tabela-consulta tbody');
        let msgDiv = document.getElementById('mensagem-consulta');
        let contadorBadge = document.getElementById('contador-ordens');
        let painelLote = document.getElementById('painel-lote');

        if (!dataConsulta) {
            alert('Selecione uma data para pesquisar.');
            return;
        }

        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">A pesquisar...</td></tr>';
        msgDiv.textContent = '';
        contadorBadge.style.display = 'none';
        painelLote.style.display = 'none';
        document.getElementById('check-todos').checked = false;

        try {
            let resposta = await fetch(`/consultar_movimentacao?data=${encodeURIComponent(dataConsulta)}`);
            let resultado = await resposta.json();

            tbody.innerHTML = '';

            if (!resultado.sucesso || !resultado.itens || resultado.itens.length === 0) {
                msgDiv.textContent = resultado.mensagem || "Nenhum registo encontrado.";
                msgDiv.style.color = '#777';
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #777;">Nenhum item registado nesta data.</td></tr>';
                return;
            }

            let itens = resultado.itens;
            contadorBadge.textContent = `Total de Ordens: ${itens.length}`;
            contadorBadge.style.display = 'inline-block';
            painelLote.style.display = 'flex';

            itens.forEach(item => {
                let dataLinha = item.Data || item.DATA || dataConsulta;
                let codigoLinha = item.Código || item.CODIGO || '';
                let qtdLinha = item.Quantidade || item.QUANTIDADE || 1;
                let statusLinha = item.Status || item.STATUS || 'Não';

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center;"><input type="checkbox" class="check-item" value="${codigoLinha}"></td>
                    <td>${dataLinha}</td>
                    <td>${codigoLinha}</td>
                    <td>${qtdLinha}</td>
                    <td><strong>${statusLinha}</strong></td>
                    <td>
                        <button class="btn-acao btn-editar" onclick="editarConsulta('${dataLinha}', '${codigoLinha}', ${qtdLinha})">Editar</button>
                        <button class="btn-acao btn-excluir" onclick="excluirConsulta('${dataLinha}', '${codigoLinha}')">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Erro ao comunicar com o servidor.</td></tr>';
        }
    }

    function alternarTodasSelecoes(master) {
        let checkboxes = document.querySelectorAll('.check-item');
        checkboxes.forEach(cb => cb.checked = master.checked);
    }

    async function aplicarStatusEmMassa() {
        let dataConsulta = document.getElementById('data-consulta').value;
        let novoStatus = document.getElementById('status-lote').value;
        let checkboxes = document.querySelectorAll('.check-item:checked');
        
        let codigosSelecionados = [];
        checkboxes.forEach(cb => codigosSelecionados.push(cb.value));

        if (codigosSelecionados.length === 0) {
            alert('Selecione pelo menos uma ordem na tabela para alterar o status!');
            return;
        }

        try {
            let resposta = await fetch('/atualizar_status_lote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: dataConsulta, codigos: codigosSelecionados, status: novoStatus })
            });
            let resultado = await resposta.json();
            alert(resultado.mensagem);
            if (resultado.sucesso) {
                consultarBaixas();
            }
        } catch (err) {
            alert('Erro de comunicação com o servidor.');
        }
    }

    async function excluirConsulta(data, codigo) {
        if (!confirm(`Tem a certeza que deseja excluir o produto ${codigo} do registo do dia ${data}?`)) return;

        try {
            let resposta = await fetch('/excluir_movimentacao', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: data, codigo: codigo })
            });
            let resultado = await resposta.json();
            alert(resultado.mensagem);
            if (resultado.sucesso) {
                consultarBaixas();
            }
        } catch (err) {
            alert('Erro de comunicação com o servidor.');
        }
    }

    async function editarConsulta(data, codigo, qtdAtual) {
